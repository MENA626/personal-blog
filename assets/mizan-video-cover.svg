<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">ميزان — غلاف الفيديو الترويجي</title>
<desc id="desc">تصميم أزرق ملكي وسماوي مع موازين العدالة الهندسية ولمسات صفراء، خاص بالفيديو الترويجي لمنصة ميزان</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071E55"/><stop offset=".46" stop-color="#0D55B4"/><stop offset="1" stop-color="#009EFF"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#38C9FF" stop-opacity=".55"/><stop offset=".48" stop-color="#009EFF" stop-opacity=".16"/><stop offset="1" stop-color="#009EFF" stop-opacity="0"/></radialGradient>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFFFFF"/><stop offset=".42" stop-color="#66CBFF"/><stop offset=".77" stop-color="#E7F7FF"/><stop offset="1" stop-color="#2A76E7"/></linearGradient>
<linearGradient id="yellow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFE47C"/><stop offset=".5" stop-color="#FFD850"/><stop offset="1" stop-color="#EAAF28"/></linearGradient>
<linearGradient id="panel" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#B8EFFF" stop-opacity=".25"/><stop offset="1" stop-color="#64A9F9" stop-opacity=".055"/></linearGradient>
