<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
<title id="title">MATCHA MOOD — كوب ماتشا</title>
<desc id="desc">غلاف رسومي بتصميم هادئ يضم كوب ماتشا بلون أخضر ناعم، مع أوراق شاي وخلفية كريمية متناسقة.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#FBF9EE"/><stop offset=".52" stop-color="#F0F4DA"/><stop offset="1" stop-color="#DCEBC2"/>
  </linearGradient>
  <radialGradient id="light"><stop stop-color="#FFFFFF" stop-opacity=".97"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="cup" x1="0" y1="0" x2="1" y2=".85">
    <stop stop-color="#FAFAF3"/><stop offset=".43" stop-color="#F0F5E5"/><stop offset="1" stop-color="#C8D6B6"/>
  </linearGradient>
  <linearGradient id="matcha" x1="0" y1="0" x2="1" y2=".9">
    <stop stop-color="#A8C775"/><stop offset=".45" stop-color="#7FA84E"/><stop offset="1" stop-color="#527C35"/>
  </linearGradient>
  <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
    <stop stop-color="#C4D98C"/><stop offset="1" stop-color="#4D7E3B"/>
  </linearGradient>
  <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="19"/></filter>
  <filter id="cupShadow" x="-20%" y="-20%" width="150%" height="180%"><feDropShadow dx="0" dy="19" stdDeviation="17" flood-color="#435B2C" flood-opacity=".23"/></filter>
  <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse"><path d="M46 0H0V46" fill="none" stroke="#86A85D" stroke-opacity=".09" stroke-width="1"/></pattern>
</defs>
<rect width="1200" height="675" fill="url(#bg)"/>
<rect width="1200" height="675" fill="url(#grid)"/>
<ellipse cx="942" cy="248" rx="365" ry="280" fill="url(#light)" opacity=".8"/>
<circle cx="1018" cy="86" r="193" fill="#D4E8AA" opacity=".45"/>
<circle cx="58" cy="630" r="215" fill="#D5E7B6" opacity=".64"/>
<!-- Round editorial mark -->
<rect x="70" y="78" width="158" height="37" rx="18" fill="#E6ECCF" stroke="#C7D3A7"/>
<circle cx="94" cy="97" r="6" fill="#648B4E"/>
<text x="110" y="103" fill="#446943" font-size="15" font-family="Arial,sans-serif" letter-spacing="2" font-weight="700">WEB PROJECT</text>
<text x="70" y="274" fill="#234C3B" font-size="100" font-weight="900" font-family="Arial,sans-serif" letter-spacing="-5">MATCHA</text>
<text x="70" y="370" fill="#548147" font-size="112" font-weight="900" font-family="Arial,sans-serif" letter-spacing="-6">MOOD</text>
<path d="M70 402H371" stroke="#9BBD6B" stroke-width="6" stroke-linecap="round"/>
<text x="73" y="460" fill="#4B6C4E" font-size="28" font-family="Arial,sans-serif" font-weight="600" letter-spacing="2.4">A LITTLE MOMENT OF GREEN</text>
<text x="72" y="548" fill="#65825B" font-size="19" font-family="Arial,sans-serif" font-weight="700" letter-spacing="3">MATCHA MOOD · LIVE WEB EXPERIENCE</text>
<!-- soft floating decorative leaves -->
<g transform="translate(1000 150) rotate(23)" opacity=".78">
  <path d="M0 55Q-22 13 18-20Q68-20 66 27Q40 57 0 55Z" fill="url(#leaf)"/>
  <path d="M3 50Q36 23 49-6" stroke="#E5F1C0" stroke-width="3" fill="none"/>
</g>
<g transform="translate(600 570) rotate(-34)" opacity=".7">
  <path d="M0 55Q-22 13 18-20Q68-20 66 27Q40 57 0 55Z" fill="url(#leaf)"/>
  <path d="M3 50Q36 23 49-6" stroke="#E5F1C0" stroke-width="3" fill="none"/>
</g>
<!-- steam loops -->
<g fill="none" stroke="#8CAE6B" stroke-linecap="round" opacity=".6">
  <path d="M784 167Q759 129 792 95Q808 76 799 57" stroke-width="6"/>
  <path d="M858 153Q833 111 871 74" stroke-width="5"/>
  <path d="M929 172Q950 125 922 93" stroke-width="5"/>
</g>
<!-- porcelain cup and matcha tea -->
<ellipse cx="840" cy="582" rx="249" ry="31" fill="#567348" opacity=".21" filter="url(#shadow)"/>
<g filter="url(#cupShadow)">
  <ellipse cx="840" cy="552" rx="242" ry="33" fill="#FDFCF6" stroke="#B7CAA0" stroke-width="4"/>
  <ellipse cx="840" cy="547" rx="182" ry="17" fill="#D5E1C9" opacity=".5"/>
  <!-- handle -->
  <path d="M979 278C1082 256 1122 298 1126 373C1130 450 1072 480 1002 457" fill="none" stroke="#EDF2E3" stroke-width="61" stroke-linecap="round"/>
  <path d="M990 293C1074 277 1104 312 1101 371C1099 421 1061 448 1000 438" fill="none" stroke="#B6C79C" stroke-width="10" opacity=".66"/>
  <!-- wide cup -->
  <path d="M652 291C667 419 702 521 753 545Q842 578 931 545C987 517 1027 410 1028 291Z" fill="url(#cup)" stroke="#B5C79F" stroke-width="3"/>
  <path d="M676 361Q720 498 781 524" fill="none" stroke="#FFFFFF" stroke-opacity=".55" stroke-width="16" stroke-linecap="round"/>
  <ellipse cx="840" cy="288" rx="195" ry="57" fill="#FDFCF8" stroke="#CBD8BE" stroke-width="5"/>
  <ellipse cx="840" cy="285" rx="174" ry="43" fill="url(#matcha)"/>
  <ellipse cx="840" cy="285" rx="160" ry="34" fill="#83AC53" opacity=".32"/>
  <!-- latte art leaf -->
  <path d="M831 294C794 289 772 272 787 263C803 252 830 261 840 276C852 255 879 252 895 265C914 282 883 299 849 297L839 317Z" fill="#F4F6DB" opacity=".92"/>
  <path d="M840 279V313M838 296L814 280M842 295L868 280" stroke="#659448" stroke-width="3.5" stroke-linecap="round"/>
  <path d="M743 412Q840 464 945 411" fill="none" stroke="#A6BE91" stroke-width="3" opacity=".45"/>
</g>
<rect x="72" y="598" width="72" height="6" rx="3" fill="#FFD850"/>
<rect x="154" y="598" width="42" height="6" rx="3" fill="#009EFF"/>
</svg>