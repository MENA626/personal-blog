<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 600" role="img" aria-labelledby="title desc">
<title id="title">شرارة — شخصية مدونة منة الله</title>
<desc id="desc">شخصية نارية مرحة بجسم أحمر وعيون كبيرة تلوّح أمام حاسوب برمجة أزرق</desc>
<defs>
<linearGradient id="flame" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#FFBE36"/><stop offset=".35" stop-color="#FF8B0D"/><stop offset="1" stop-color="#F85309"/></linearGradient>
<linearGradient id="innerFlame" x1=".2" y1="0" x2=".9" y2="1"><stop stop-color="#FFE56C"/><stop offset=".55" stop-color="#FFAE20"/><stop offset="1" stop-color="#FF850D"/></linearGradient>
<linearGradient id="body" x1=".12" y1=".2" x2=".9" y2="1"><stop stop-color="#FF6474"/><stop offset=".6" stop-color="#EF3148"/><stop offset="1" stop-color="#BA2347"/></linearGradient>
<linearGradient id="screen" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8EC7FF"/><stop offset=".65" stop-color="#4487D6"/><stop offset="1" stop-color="#23519D"/></linearGradient>
<linearGradient id="book" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFB824"/><stop offset="1" stop-color="#F77A0C"/></linearGradient>
<filter id="shadow" x="-40%" y="-40%" width="180%" height="200%"><feGaussianBlur stdDeviation="11"/></filter>
</defs>
<style>
@keyframes helloWave{0%,100%{transform:rotate(0deg)}22%{transform:rotate(-13deg)}44%{transform:rotate(9deg)}62%{transform:rotate(-10deg)}80%{transform:rotate(4deg)}}
@keyframes fireGlow{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.025)}}
@keyframes eyeBlink{0%,45%,51%,100%{transform:scaleY(1)}48%{transform:scaleY(.1)}}
@keyframes spark{0%,100%{opacity:.35;transform:scale(.85)}50%{opacity:1;transform:scale(1.12)}}
#flames{animation:fireGlow 4.6s ease-in-out infinite;transform-origin:50% 69%}
#wave-arm{animation:helloWave 4.5s ease-in-out infinite;transform-origin:350px 348px;transform-box:view-box}
.eye{animation:eyeBlink 6.8s linear infinite;transform-origin:center;transform-box:fill-box}
#sparkle{animation:spark 2.3s ease-in-out infinite;transform-origin:center}
@media(prefers-reduced-motion:reduce){#flames,#wave-arm,.eye,#sparkle{animation:none}}
</style>
