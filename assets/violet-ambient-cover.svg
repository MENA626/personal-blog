<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
<title>Soft violet atmospheric gradient for Menat Allah portfolio</title>
<defs>
 <radialGradient id="leftCloud" cx="0" cy="0.19" r="1.12" fx="0" fy=".19">
  <stop offset="0" stop-color="#E1D3F6"/><stop offset=".18" stop-color="#C3A7E4"/><stop offset=".40" stop-color="#9474BC"/><stop offset=".69" stop-color="#473768"/><stop offset="1" stop-color="#161020"/>
 </radialGradient>
 <radialGradient id="coldGlow" cx=".20" cy=".17" r=".67" fx=".15" fy=".08">
  <stop offset="0" stop-color="#F2E9FE" stop-opacity=".94"/><stop offset=".31" stop-color="#B9A0D8" stop-opacity=".55"/><stop offset=".72" stop-color="#7D60A1" stop-opacity=".09"/><stop offset="1" stop-color="#1B102A" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="bottomFog" cx=".07" cy="1.02" r=".66" fx=".07" fy="1.02">
  <stop offset="0" stop-color="#E1D6F6" stop-opacity=".95"/><stop offset=".24" stop-color="#B8A2D4" stop-opacity=".78"/><stop offset=".52" stop-color="#6F568C" stop-opacity=".16"/><stop offset="1" stop-color="#241832" stop-opacity="0"/>
 </radialGradient>
 <radialGradient id="rightVignette" cx="1" cy=".60" r=".88" fx="1" fy=".55">
  <stop offset="0" stop-color="#0B0816"/><stop offset=".55" stop-color="#150F24" stop-opacity=".94"/><stop offset="1" stop-color="#1E1434" stop-opacity="0"/>
 </radialGradient>
 <linearGradient id="shade" x1="0" x2="1" y1="0" y2="1">
  <stop offset="0" stop-color="#D5C2E8" stop-opacity=".13"/><stop offset=".34" stop-color="#B99BD6" stop-opacity="0"/><stop offset=".66" stop-color="#150F22" stop-opacity=".38"/><stop offset="1" stop-color="#080611" stop-opacity=".88"/>
 </linearGradient>
 <filter id="soften"><feGaussianBlur stdDeviation="83"/></filter>
 <filter id="grain">
  <feTurbulence type="fractalNoise" baseFrequency=".27" numOctaves="3" seed="7" stitchTiles="stitch" result="noise"/>
  <feColorMatrix type="saturate" values="0" in="noise"/>
  <feComponentTransfer><feFuncA type="linear" slope=".085"/></feComponentTransfer>
 </filter>
</defs>
<rect width="1920" height="1080" fill="#140F25"/>
<rect width="1920" height="1080" fill="url(#leftCloud)"/>
<g filter="url(#soften)">
 <ellipse cx="220" cy="132" rx="720" ry="800" fill="#D3BCEB" opacity=".48"/>
 <ellipse cx="-5" cy="1035" rx="610" ry="245" fill="#EAE1FA" opacity=".68"/>
 <ellipse cx="1260" cy="555" rx="740" ry="960" fill="#0A0718" opacity=".69"/>
 <ellipse cx="1020" cy="32" rx="770" ry="240" fill="#6C528E" opacity=".25"/>
</g>
<rect width="1920" height="1080" fill="url(#coldGlow)"/>
<rect width="1920" height="1080" fill="url(#bottomFog)"/>
<rect width="1920" height="1080" fill="url(#rightVignette)" opacity=".83"/>
<rect width="1920" height="1080" fill="url(#shade)"/>
<rect width="1920" height="1080" filter="url(#grain)" opacity=".55"/>
</svg>